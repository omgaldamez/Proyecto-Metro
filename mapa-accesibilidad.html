<title>Metro CDMX — Mapa de Accesibilidad</title>

<style>
*,*::before,*::after{box-sizing:border-box;margin:0;padding:0}
:root{
  --bg:#f8f7f2;--canvas:#ffffff;--panel:#f0efe8;--card:#e6e4dc;
  --border:rgba(20,18,10,.1);--text:#1a1814;--text2:rgba(20,18,10,.58);--text3:rgba(20,18,10,.36);
  --sans:'DM Sans',sans-serif;--mono:'Space Mono',monospace;
  --green:#2a985a;--red:#cc3300;--amber:#c07a00;
}
html,body{height:100%;overflow:hidden;background:var(--bg)}
body{font-family:var(--sans);color:var(--text);display:flex;flex-direction:column}

#top-bar{
  height:42px;background:var(--bg);border-bottom:1.5px solid var(--border);
  display:flex;align-items:center;justify-content:space-between;padding:0 18px;
  flex-shrink:0;z-index:10;
}
.tb-logo{font-family:var(--sans);font-size:.7rem;font-weight:700;letter-spacing:.08em;text-transform:uppercase;display:flex;align-items:center;gap:9px}
.tb-logo-mark{display:flex;gap:2px}
.tb-logo-mark span{width:5px;height:5px;border-radius:50%}
.tb-nav{display:flex;align-items:center;gap:5px;font-family:var(--sans);font-size:.52rem;font-weight:500;letter-spacing:.05em;text-transform:uppercase}
.tb-nav a{color:var(--text3);text-decoration:none;padding:3px 8px;border:1px solid var(--border);border-radius:3px;transition:all .14s}
.tb-nav a:hover{color:var(--text);border-color:var(--text)}
.tb-nav a.on{color:var(--text);border-color:var(--text);font-weight:700}

#app{flex:1;display:flex;min-height:0}
#map-wrap{flex:1;position:relative;overflow:hidden;background:var(--canvas);border-right:1.5px solid var(--border)}
#map-svg{width:100%;height:100%;cursor:grab;display:block}
#map-svg:active{cursor:grabbing}

#sidebar{
  width:230px;flex-shrink:0;overflow-y:auto;background:var(--bg);
  padding:14px 13px;display:flex;flex-direction:column;gap:14px;
}
#sidebar::-webkit-scrollbar{width:3px}
#sidebar::-webkit-scrollbar-thumb{background:var(--border);border-radius:2px}
.sb-label{font-family:var(--mono);font-size:.4rem;font-weight:700;letter-spacing:.2em;text-transform:uppercase;color:var(--text3);margin-bottom:7px}

.vbtns{display:flex;flex-direction:column;gap:3px}
.vbtn{
  font-family:var(--sans);font-size:.66rem;font-weight:500;
  padding:6px 9px;border:1px solid var(--border);border-radius:4px;
  background:transparent;color:var(--text2);cursor:pointer;text-align:left;
  transition:all .13s;display:flex;align-items:center;gap:7px;
}
.vbtn:hover{background:var(--card);color:var(--text)}
.vbtn.on{background:var(--text);color:#fff;border-color:var(--text)}
.vbtn-pip{width:8px;height:8px;border-radius:50%;flex-shrink:0}

.acc-items{display:flex;flex-direction:column;gap:5px}
.acc-item{display:flex;align-items:center;gap:7px;font-family:var(--sans);font-size:.62rem;color:var(--text2)}

.llist{display:flex;flex-direction:column;gap:2px}
.lrow{
  display:flex;align-items:center;gap:7px;font-family:var(--sans);font-size:.6rem;color:var(--text2);
  padding:3px 5px;border-radius:3px;cursor:pointer;transition:background .12s;
}
.lrow:hover{background:var(--card)}
.lrow.dim{opacity:.3}
.lswatch{height:5px;border-radius:2px;flex-shrink:0}
.lname{flex:1;font-size:.6rem}
.lpct{font-family:var(--mono);font-size:.42rem;color:var(--text3)}

.stat-items{display:flex;flex-direction:column;gap:8px}
.stat-item{}
.stat-head{display:flex;justify-content:space-between;align-items:baseline;margin-bottom:3px}
.stat-lbl{font-family:var(--sans);font-size:.56rem;color:var(--text2);display:flex;align-items:center;gap:5px}
.stat-val{font-family:var(--mono);font-size:.52rem;font-weight:700;color:var(--text)}
.mbar{height:3px;background:var(--card);border-radius:2px;overflow:hidden}
.mbar-fill{height:100%;border-radius:2px;transition:width .5s ease}

#tooltip{
  position:fixed;z-index:1000;background:var(--bg);border:1px solid var(--border);
  border-radius:7px;padding:10px 13px;font-family:var(--sans);font-size:.72rem;
  color:var(--text);pointer-events:none;opacity:0;transition:opacity .1s;
  max-width:210px;box-shadow:0 6px 24px rgba(0,0,0,.1);line-height:1.55;
}
#tooltip .ttn{font-weight:700;font-size:.8rem;margin-bottom:2px}
#tooltip .ttl{font-family:var(--mono);font-size:.44rem;color:var(--text3);letter-spacing:.06em;text-transform:uppercase;margin-bottom:5px}
#tooltip .tta{font-size:.64rem;font-weight:600;display:flex;align-items:center;gap:5px}
#tooltip .ttf{font-size:.58rem;color:var(--text3);margin-top:3px}

#zc{position:absolute;bottom:14px;left:14px;display:flex;flex-direction:column;gap:3px;z-index:5}
.zb{
  width:26px;height:26px;background:var(--bg);border:1px solid var(--border);border-radius:4px;
  display:flex;align-items:center;justify-content:center;cursor:pointer;
  font-size:15px;color:var(--text2);transition:all .13s;font-family:var(--mono);line-height:1;
}
.zb:hover{background:var(--card);color:var(--text)}

.map-badge{
  font-family:'Space Mono',monospace;font-size:5.5px;font-weight:700;
  fill:#fff;pointer-events:none;dominant-baseline:middle;text-anchor:middle;
}

@media(max-width:640px){
  #sidebar{width:100%;height:140px;flex-shrink:0;flex-direction:row;overflow-x:auto;overflow-y:hidden;padding:10px;gap:10px}
  #app{flex-direction:column}
  .sb-section{flex-shrink:0;min-width:140px}
  #map-wrap{border-right:none;border-bottom:1.5px solid var(--border)}
}
</style>
</head>

        <div class="acc-item">

      </div>
    </div>

    <div class="sb-section">
      <div class="sb-label">Líneas</div>
      <div class="llist" id="llist"></div>
    </div>

    <div class="sb-section">
      <div class="sb-label">Accesibilidad por línea</div>
      <div class="stat-items" id="stats"></div>
    </div>
  </div>
</div>

const LINE_COLORS = {
  '1':'#E4538F','2':'#0069A7','3':'#A08C00','4':'#5BB5A7','5':'#C8A900',
  '6':'#D63028','7':'#E86820','8':'#0F7A42','9':'#704030','12':'#C4A000',
  'A':'#922882','B':'#808080'
};
const LINE_NAMES = {
  '1':'Línea 1','2':'Línea 2','3':'Línea 3','4':'Línea 4','5':'Línea 5','6':'Línea 6',
  '7':'Línea 7','8':'Línea 8','9':'Línea 9','12':'Línea 12','A':'Línea A','B':'Línea B'
};
const LINE_ORDER = ['1','2','3','4','5','6','7','8','9','12','A','B'];

function displayName(id) {
  return id.replace(/_\d+$/, '').replace(/_[A-B]$/, '').replace(/_/g,' ');
}

const svg = d3.select('#map-svg');
const tooltip = document.getElementById('tooltip');
let currentView = 'acc';
let zoomBehavior;

function nodeColor(n) {
  if (currentView === 'acc') return n.ac === 'Si' ? '#2a985a' : '#ffffff';
  if (currentView === 'flu') return d3.interpolateBlues(0.15 + (n.af / 10200) * 0.85);
  return '#ffffff';
}

function nodeBorder(n) {
  if (currentView === 'net') return LINE_COLORS[n.l] || '#888';
  return n.ac === 'Si' ? '#1c7040' : '#cc3300';
}

function buildMap() {
  const W = document.getElementById('map-wrap').clientWidth;
  const H = document.getElementById('map-wrap').clientHeight;
  svg.attr('viewBox', `0 0 ${W} ${H}`);

  const pad = 40;
  const lngExt = d3.extent(NODES, d => d.lng);
  const latExt = d3.extent(NODES, d => d.lat);
  const lngRange = lngExt[1] - lngExt[0];
  const latRange = latExt[1] - latExt[0];
  const scale = Math.min((W - pad*2) / lngRange, (H - pad*2) / latRange);
  const offX = (W - lngRange * scale) / 2;
  const offY = (H - latRange * scale) / 2;

  const px = lng => (lng - lngExt[0]) * scale + offX;
  const py = lat => (latExt[1] - lat) * scale + offY;

  const nodeMap = new Map(NODES.map(n => [n.id, n]));

  const byLoc = new Map();
  NODES.forEach(n => {
    const k = `${n.lat.toFixed(5)},${n.lng.toFixed(5)}`;
    if (!byLoc.has(k)) byLoc.set(k, []);
    byLoc.get(k).push(n);
  });

  svg.selectAll('*').remove();
  const g = svg.append('g').attr('class', 'map-root');

  g.append('rect').attr('width', W).attr('height', H).attr('fill', '#ffffff');

  const gridG = g.append('g').attr('opacity', 0.25);
  const step = 0.05;
  for (let lng = Math.ceil(lngExt[0]/step)*step; lng <= lngExt[1]; lng += step) {
    gridG.append('line').attr('x1',px(lng)).attr('x2',px(lng)).attr('y1',0).attr('y2',H)
      .attr('stroke','#ddd').attr('stroke-width',0.5);
  }
  for (let lat = Math.ceil(latExt[0]/step)*step; lat <= latExt[1]; lat += step) {
    gridG.append('line').attr('y1',py(lat)).attr('y2',py(lat)).attr('x1',0).attr('x2',W)
      .attr('stroke','#ddd').attr('stroke-width',0.5);
  }

  const linesG = g.append('g');
  LINE_ORDER.forEach(linea => {
    EDGES.filter(e => e[2] === linea).forEach(([src, tgt]) => {
      const s = nodeMap.get(src), t = nodeMap.get(tgt);
      if (!s || !t) return;
      linesG.append('line')
        .attr('x1',px(s.lng)).attr('y1',py(s.lat))
        .attr('x2',px(t.lng)).attr('y2',py(t.lat))
        .attr('stroke', LINE_COLORS[linea])
        .attr('stroke-width', 5)
        .attr('stroke-linecap','round');
    });
  });

  const nodesG = g.append('g');

  byLoc.forEach((nodes) => {
    const rep = nodes[0];
    const isTransfer = nodes.some(n => n.t.includes('Transbordo')) || nodes.length > 1;
    if (!isTransfer) return;
    nodesG.append('circle')
      .attr('cx',px(rep.lng)).attr('cy',py(rep.lat)).attr('r',10)
      .attr('fill','none').attr('stroke','#ccc').attr('stroke-width',1.5)
      .attr('stroke-dasharray','3 2').attr('pointer-events','none');
  });

  byLoc.forEach((nodes, key) => {
    const rep = nodes[0];
    const isTransfer = nodes.some(n => n.t.includes('Transbordo')) || nodes.length > 1;
    const isTerminal = nodes.some(n => n.t.includes('Terminal'));
    const r = isTransfer ? 7 : isTerminal ? 6 : 4.5;
    const anyAcc = nodes.some(n => n.ac === 'Si');
    const maxAf = Math.max(...nodes.map(n => n.af || 0));
    const pseudo = {...rep, ac: anyAcc ? 'Si' : 'No', af: maxAf};

    nodesG.append('circle')
      .attr('cx',px(rep.lng)).attr('cy',py(rep.lat)).attr('r',r)
      .attr('fill', nodeColor(pseudo))
      .attr('stroke', nodeBorder(pseudo))
      .attr('stroke-width', isTransfer ? 2 : 1.5)
      .attr('class','station-dot').attr('data-key', key)
      .style('cursor','pointer')
      .on('mousemove', (evt) => {
        const names = [...new Set(nodes.map(n => displayName(n.id)))].join(' / ');
        const lines = [...new Set(nodes.map(n => LINE_NAMES[n.l]))].join(', ');
        const accTxt = anyAcc
          ? '<span style="color:#2a985a;font-weight:600">✓ Accesible</span>'
          : '<span style="color:#cc3300;font-weight:600">✗ No accesible</span>';
        const flu = maxAf > 0 ? `${maxAf.toLocaleString('es-MX')} personas/día` : '—';
        tooltip.innerHTML = `<div class="ttn">${names}</div><div class="ttl">${lines}</div><div class="tta">${accTxt}</div><div class="ttf">Afluencia: ${flu}</div>`;
        tooltip.style.opacity = '1';
        tooltip.style.left = `${evt.clientX + 14}px`;
        tooltip.style.top = `${evt.clientY - 10}px`;
      })
      .on('mouseleave', () => { tooltip.style.opacity = '0'; });
  });

  const badgeG = g.append('g').attr('pointer-events','none');
  LINE_ORDER.forEach(linea => {
    const terminals = NODES.filter(n => n.l === linea && n.t.includes('Terminal'));
    if (!terminals.length) return;
    const rep = terminals[0];
    const bg = badgeG.append('g').attr('transform',`translate(${px(rep.lng)},${py(rep.lat) - 14})`);
    bg.append('rect').attr('x',-8).attr('y',-7).attr('width',16).attr('height',12)
      .attr('rx',2).attr('fill', LINE_COLORS[linea]);
    bg.append('text').attr('class','map-badge').attr('dy','0.1em')
      .attr('fill','#fff').text(linea.length > 1 ? linea : `L${linea}`);
  });

  zoomBehavior = d3.zoom().scaleExtent([0.4,10])
    .on('zoom', evt => g.attr('transform', evt.transform));
  svg.call(zoomBehavior);
  svg.call(zoomBehavior.transform, d3.zoomIdentity);
}

function refreshDots() {
  const byLoc = new Map();
  NODES.forEach(n => {
    const k = `${n.lat.toFixed(5)},${n.lng.toFixed(5)}`;
    if (!byLoc.has(k)) byLoc.set(k, []);
    byLoc.get(k).push(n);
  });
  d3.selectAll('.station-dot').each(function() {
    const nodes = byLoc.get(this.getAttribute('data-key')) || [];
    const anyAcc = nodes.some(n => n.ac === 'Si');
    const maxAf = Math.max(...nodes.map(n => n.af || 0));
    const pseudo = {...(nodes[0]||{}), ac: anyAcc?'Si':'No', af: maxAf};
    d3.select(this).attr('fill', nodeColor(pseudo)).attr('stroke', nodeBorder(pseudo));
  });
}

function buildSidebar() {
  const ll = document.getElementById('llist');
  ll.innerHTML = '';
  LINE_ORDER.forEach(linea => {
    const nodes = NODES.filter(n => n.l === linea);
    const pct = Math.round(nodes.filter(n => n.ac === 'Si').length / nodes.length * 100);
    const row = document.createElement('div');
    row.className = 'lrow';
    row.innerHTML = `<div class="lswatch" style="width:18px;background:${LINE_COLORS[linea]}"></div><span class="lname">${LINE_NAMES[linea]}</span><span class="lpct">${pct}%</span>`;
    ll.appendChild(row);
  });

  const sw = document.getElementById('stats');
  sw.innerHTML = '';
  LINE_ORDER.forEach(linea => {
    const nodes = NODES.filter(n => n.l === linea);
    const acc = nodes.filter(n => n.ac === 'Si').length;
    const pct = Math.round(acc / nodes.length * 100);
    const col = LINE_COLORS[linea];
    const barCol = pct > 60 ? '#2a985a' : pct > 30 ? '#c07a00' : '#cc3300';
    const item = document.createElement('div');
    item.className = 'stat-item';
    item.innerHTML = `<div class="stat-head"><span class="stat-lbl"><span style="display:inline-block;width:8px;height:8px;border-radius:50%;background:${col};flex-shrink:0"></span>${LINE_NAMES[linea]}</span><span class="stat-val">${acc}/${nodes.length}</span></div><div class="mbar"><div class="mbar-fill" style="width:${pct}%;background:${barCol}"></div></div>`;
    sw.appendChild(item);
  });
}

document.querySelectorAll('.vbtn').forEach(btn => {
  btn.addEventListener('click', () => {
    document.querySelectorAll('.vbtn').forEach(b => b.classList.remove('on'));
    btn.classList.add('on');
    currentView = btn.dataset.view;
    refreshDots();
    document.getElementById('acc-leg').style.display = currentView === 'acc' ? '' : 'none';
  });
});

document.getElementById('zi').addEventListener('click', () => svg.transition().duration(300).call(zoomBehavior.scaleBy, 1.5));
document.getElementById('zo').addEventListener('click', () => svg.transition().duration(300).call(zoomBehavior.scaleBy, 0.67));
document.getElementById('zr').addEventListener('click', () => svg.transition().duration(400).call(zoomBehavior.transform, d3.zoomIdentity));

buildMap();
buildSidebar();
window.addEventListener('resize', buildMap);
</script>
